{% extends 'base.html' %}
{% block content %}
<h2>Tickets</h2>
<a href="{% url 'tickets:ticket_create' %}">Create Ticket</a>
<ul>
  {% for ticket in tickets %}
    <li><a href="{% url 'tickets:ticket_detail' ticket.pk %}">{{ ticket.title }}</a> - {{ ticket.status }}</li>
  {% empty %}
    <li>No tickets yet.</li>
  {% endfor %}
</ul>
{% endblock %}
